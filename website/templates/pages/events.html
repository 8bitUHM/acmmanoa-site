{% extends "base.html" %}
{% block title %}Events | ACM at UH Mānoa{% endblock %}
{% block content %}
<div class="subhero">
  <div class="wrap">
    <div class="eyebrow">Events</div>
    <h1>Something's always happening.</h1>
    <p>Workshops, socials, talks, and more — from ACM and all of our SIGs.</p>
    <a class="btn btn-primary" href="{{ calendar_feed_url }}">Subscribe to calendar (.ics)</a>
  </div>
</div>
<section>
  <div class="wrap">
    <iframe src="{% url 'calendar_embed' %}" title="ACM and SIG event calendar" style="width:100%;height:1050px;border:0" loading="lazy" referrerpolicy="same-origin"></iframe>
  </div>
</section>
{% endblock %}
